name: Validate and release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['**']

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate.py
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/validate.py --tag "$env:RELEASE_TAG"
        shell: pwsh
      - run: python -m unittest discover -s tests -v
      - run: python tools/package.py

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/package.py --tag "$RELEASE_TAG"
      - name: Create draft, upload and publish
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release existente: não será substituída. Inspecione rascunhos incompletos antes de repetir."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Skill Base $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*-manifest.json dist/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
